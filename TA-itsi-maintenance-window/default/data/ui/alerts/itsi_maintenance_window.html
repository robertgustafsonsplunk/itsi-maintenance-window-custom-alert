<form class="form-horizontal form-complex">
    <div class="control-group">
        <label class="control-label" for="itsi_mw_title_prefix">Title prefix</label>
        <div class="controls">
            <input type="text" class="input-xlarge" name="action.itsi_maintenance_window.param.title_prefix" id="itsi_mw_title_prefix" placeholder="CMDB Maintenance"/>
            <span class="help-block">Prefix used when naming the ITSI maintenance window.</span>
        </div>
    </div>
    <div class="control-group">
        <label class="control-label" for="itsi_mw_identifier_field">Identifier field</label>
        <div class="controls">
            <input type="text" class="input-xlarge" name="action.itsi_maintenance_window.param.identifier_field" id="itsi_mw_identifier_field" placeholder="title"/>
            <span class="help-block">Search result field that matches the ITSI entity or service title.</span>
        </div>
    </div>
    <div class="control-group">
        <label class="control-label" for="itsi_mw_object_type">Object type</label>
        <div class="controls">
            <input type="text" class="input-xlarge" name="action.itsi_maintenance_window.param.object_type" id="itsi_mw_object_type" placeholder="entity"/>
            <span class="help-block">ITSI object type to put in maintenance: entity or service.</span>
        </div>
    </div>
</form>
